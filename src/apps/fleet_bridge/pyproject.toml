[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet_bridge"
version = "0.1.0"
requires-python = ">=3.11"
description = "Restricted fleet operations for a single-operator MCP pilot"

[tool.setuptools.package-data]
fleet_bridge = ["modules.txt", "**/*.json", "**/*.js", "**/*.css"]
